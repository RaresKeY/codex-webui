name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: codex-webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime identity and writable home
        run: docker run --rm --entrypoint sh codex-webui:ci -c 'test "$(id -u)" != 0 && test -w "$HOME" && test "$(codex --version)" = "codex-cli $CODEX_VERSION"'
      - name: Smoke test the degraded web service
        run: |
          docker run --detach --name codex-webui-ci \
            --publish 127.0.0.1:8765:8000 \
            --env CODEX_WEBUI_CODEX_ENABLED=false \
            codex-webui:ci
          trap 'docker rm --force codex-webui-ci' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          docker logs codex-webui-ci
          exit 1

  arm64-container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: codex-webui:arm64-ci
          cache-from: type=gha,scope=container-arm64
          cache-to: type=gha,mode=max,scope=container-arm64
      - name: Verify arm64 runtime and bundled Codex
        run: docker run --rm --platform linux/arm64 --entrypoint sh codex-webui:arm64-ci -c 'test "$(uname -m)" = "aarch64" && test "$(id -u)" != 0 && test -w "$HOME" && test "$(codex --version)" = "codex-cli $CODEX_VERSION"'
      - name: Smoke test the arm64 degraded web service
        run: |
          docker run --detach --name codex-webui-arm64-ci \
            --platform linux/arm64 \
            --publish 127.0.0.1:8765:8000 \
            --env CODEX_WEBUI_CODEX_ENABLED=false \
            codex-webui:arm64-ci
          trap 'docker rm --force codex-webui-arm64-ci' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8765/api/health && exit 0
            sleep 1
          done
          docker logs codex-webui-arm64-ci
          exit 1
